services:
  postgres:
    image: postgres:16-alpine
    container_name: health-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_base
      POSTGRES_USER: health_base
      POSTGRES_PASSWORD: health_base
    ports:
      - "5432:5432"
    volumes:
      - health-base-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_base -d health_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./microservice/user-service
    container_name: health-base-user-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: health_base_user
      DB_USER: health_base
      DB_PASSWORD: health_base
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

  clinic-service:
    build:
      context: ./microservice/clinic-service
    container_name: health-base-clinic-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: health_base_clinic
      DB_USER: health_base
      DB_PASSWORD: health_base
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./microservice/api-gateway
    container_name: health-base-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy

volumes:
  health-base-pgdata:
